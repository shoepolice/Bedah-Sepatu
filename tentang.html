<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tentang — Shoe Police</title>
<link rel="icon" href="assets/logo/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css?v=34">
</head>
<body data-hal="tentang">
<main id="isi-tentang">
  <section class="tt-hero"><div class="wrap tt-hero-grid">
    <div><h1>Tentang <em>Shoe Police</em></h1><div id="tt-intro" class="tt-intro"></div></div>
    <div class="tt-logo"><img src="assets/logo/logo-shoepolice-besar.png" alt="Logo Shoe Police"></div>
  </div></section>

  <div class="wrap isi-hal tt">
    <section class="tt-sek tt-mengapa">
      <h2 class="tt-judul">Mengapa <em>Shoe Police?</em></h2>
      <div><div class="tt-pendekatan" id="tt-pendekatan"></div><div id="tt-mengapa" class="tt-teks"></div></div>
    </section>

    <section class="tt-sek"><h2 class="tt-judul">Segmen <em>konten</em></h2><div class="dua" id="segmen"></div></section>

    <section class="tt-sek"><h2 class="tt-judul">Jenis <em>konten</em></h2><p class="lead">Jenis konten yang bisa kami kerjakan bersama brand.</p><div class="tt-jenis" id="tt-jenis"></div></section>

    <section class="tt-sek"><h2 class="tt-judul">Karakter <em>audiens</em></h2><p class="lead" id="tt-aud-intro"></p>
      <div class="tt-stat" id="tt-stat"></div><p class="tt-ciri" id="tt-ciri"></p>
      <h3 class="tt-sub">Profil audiens</h3><div class="tbl-wrap"><table class="tbl-tes" id="tt-profil"></table></div>
    </section>

    <section class="tt-sek"><h2 class="tt-judul">Audiens per <em>platform</em></h2><div class="tt-plat" id="tt-plat"></div></section>

    <section class="tt-sek"><h2 class="tt-judul">Pencapaian</h2><div class="tt-capai" id="tt-capai"></div></section>
  </div>
</main>

<script src="assets/app.js?v=34"></script>
<script>
SP.muatConfig().then(c => {
  const T = c.tentang || {}, e = SP.esc;
  // **tebal** & *miring* sederhana
  const md = s => e(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
  const set = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };
  const IK = {
    yt: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12a31 31 0 0 0 .4 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-4.8 31 31 0 0 0-.4-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>',
    tt: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16.6 3c.4 2.2 1.8 3.6 4 3.8v3.1c-1.5.1-2.8-.4-4-1.2v6.1c0 3.6-2.9 6.2-6.3 6.2A6.2 6.2 0 0 1 4 14.8c0-3.7 3.2-6.6 7-6.1v3.2c-1.8-.4-3.6.8-3.6 2.8a3 3 0 0 0 3 3.1c1.8 0 3-1.2 3-3.3V3h3.2z"/></svg>',
    ig: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12a31 31 0 0 0 .4 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-4.8 31 31 0 0 0-.4-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>',
    mic: '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>',
    kolab: '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3.5"/><circle cx="16" cy="8" r="3.5"/><path d="M2 20c0-3.3 2.7-6 6-6 1.5 0 2.9.6 4 1.5A6 6 0 0 1 22 20"/></svg>'
  };

  set('tt-intro', (T.intro || []).map(p => `<p>${md(p)}</p>`).join(''));
  set('tt-pendekatan', (T.pendekatan || []).map(p => `<div><b>${e(p.nama)}</b><span>${e(p.desc)}</span></div>`).join(''));
  set('tt-mengapa', (T.mengapa || []).map(p => `<p>${md(p)}</p>`).join(''));
  set('segmen', (c.segmen || []).map(s => `<div class="box"><h3>${e(s.nama)}</h3><p>${e(s.desc)}</p></div>`).join(''));
  set('tt-jenis', (T.jenisKonten || []).map((j, i) => `<div class="${i % 3 === 1 ? 'putih' : ''}"><span>${String(i + 1).padStart(2, '0')}</span>${e(j)}</div>`).join(''));
  const A = T.audiens || {};
  set('tt-aud-intro', e(A.intro || ''));
  set('tt-stat', (A.stat || []).map(s => `<div><small>${e(s.judul)}</small><b>${e(s.angka)}</b><span>${e(s.ket)}</span></div>`).join(''));
  set('tt-ciri', A.ciri ? `<b>Ciri-ciri:</b> ${e(A.ciri)}` : '');
  set('tt-profil', `<thead><tr><th>Dimensi</th><th>Demografi</th><th>Relevansi strategis</th></tr></thead><tbody>${(A.profil || []).map(r => `<tr>${r.map((x, i) => `<td>${i ? e(x) : `<b>${e(x)}</b>`}</td>`).join('')}</tr>`).join('')}</tbody>`);
  set('tt-plat', (T.platform || []).map(p => `<div class="tt-p">
    <a class="tt-p-kepala" href="${e(p.link)}" target="_blank" rel="noopener">${IK[p.ikon] || ''}<div><b>${e(p.nama)}</b><span>${e(p.pengikut)} pengikut</span></div></a>
    <dl>
      <div><dt>Jenis kelamin</dt><dd>${e(p.gender)}</dd></div>
      <div><dt>Usia</dt><dd>${(p.usia || []).map(([k, v]) => `${e(k)} <b>${e(v)}</b>`).join('<br>')}</dd></div>
      <div><dt>Lokasi teratas</dt><dd>${e(p.lokasi)}</dd></div>
      <div><dt>Rata-rata interaksi</dt><dd>${e(p.interaksi)}</dd></div>
      <div><dt>Tingkat keterlibatan</dt><dd><b>${e(p.er)}</b></dd></div>
    </dl></div>`).join(''));
  set('tt-capai', (T.pencapaian || []).map(p => `<div><i>${IK[p.ikon] || ''}</i><b>${e(p.judul)}</b><span>${e(p.ket)}</span></div>`).join(''));
});
</script>
</body>
</html>
