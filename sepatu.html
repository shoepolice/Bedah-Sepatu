<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hasil Bedah — Shoe Police</title>
<link rel="icon" href="assets/logo/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css?v=35">
</head>
<body data-hal="database">
<main class="wrap" id="isi"><p class="kosong-info">Memuat…</p></main>

<script src="assets/app.js?v=35"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const { sepatu = [] } = await SP.muatData();
  const s = sepatu.find(x => x.id === id);
  const el = document.getElementById('isi');
  if (!s) { el.innerHTML = '<p class="kosong-info">Sepatu tidak ditemukan. <a href="database.html"><u>Kembali ke database</u></a></p>'; return; }
  document.title = `${s.brand} ${s.model} — Hasil Bedah Shoe Police`;
  const a = s.angka || {}, e = SP.esc, f = SP.fmt, t = SP.tier(s.skor);
  const grup = SP.pembanding(sepatu, s);
  const namaGrup = grup === sepatu ? 'semua sepatu' : 'sepatu ' + s.kategori.toLowerCase();
  const { plus, minus } = SP.kelebihan(sepatu, s);

  // ----- baris uji lab dengan skala vs rata-rata -----
  // metrik yang punya data pembanding → baris dengan skala; sisanya → grid angka ringkas
  const adaBanding = m => { const st = SP.statistik(grup, m.k); return st && st.n >= 2 && st.max > st.min; };
  const metrikAda = SP.METRIK.filter(m => typeof a[m.k] === 'number');
  const barisUji = metrikAda.filter(adaBanding).map(m => {
    const stt = SP.statistik(grup, m.k), x = a[m.k];
    const pos = v => ((v - stt.min) / (stt.max - stt.min)) * 100;
    const p = SP.persentil(stt, x, m.arah || 1);
    const ket = m.arah === 0
      ? `${x > stt.avg ? 'Di atas' : 'Di bawah'} rata-rata ${namaGrup} (<b>${f(stt.avg)} ${m.sat}</b>)`
      : `${p >= 50 ? (m.arah === -1 ? 'Lebih ringan' : 'Lebih tinggi') : (m.arah === -1 ? 'Lebih berat' : 'Lebih rendah')} dari <b>${p >= 50 ? p : 100 - p}%</b> ${namaGrup} · rata-rata ${f(stt.avg)} ${m.sat}`;
    return `<div class="uji"><div><div class="lbl">${m.lbl}<small>${m.desc}</small></div><div class="nilai">${f(x)}<i>${m.sat}</i></div></div><div>
      ${SP.tick(Math.max(3, pos(x)), pos(stt.avg), 40)}
      <div class="skala-lbl"><span>${f(stt.min)} ${m.sat}</span><span>▮ rata-rata ${f(stt.avg)} ${m.sat}</span><span>${f(stt.max)} ${m.sat}</span></div>
      <div class="skala-ket">${ket}</div></div></div>`;
  }).join('') + (metrikAda.some(m => !adaBanding(m)) ? `<div class="angka-grid">${metrikAda.filter(m => !adaBanding(m)).map(m =>
    `<div><span>${m.lbl}</span><b>${f(a[m.k])}<i>${m.sat}</i></b></div>`).join('')}</div>` : '');

  const fakta = [['Kategori', s.kategori + (s.subtipe ? ' · ' + s.subtipe : '')], ['Harga retail', s.harga], ['Size yang dites', s.size && 'EU ' + s.size],
    ['Tester', s.tester], ['Tanggal tes', s.tanggal], ['Midsole', a.materialMidsole], ['Outsole', a.outsoleMaterial],
    ['Grip kering / basah', (a.gripKering || a.gripBasah) && `${a.gripKering || '–'} / ${a.gripBasah || '–'}`], ['Sizing', a.sizing]]
    .filter(x => x[1]).map(([k, v]) => `<tr><td>${k}</td><td>${e(v)}</td></tr>`).join('');

  const layer = (s.layer || []).map(l => `<div class="k">${SP.ring(l.skor, 70)}<b>${e(l.nama)}</b><span>${e(l.kelas)} · bobot ${e(l.bobot)}</span></div>`).join('');
  const mirip = grup.filter(x => x.id !== s.id).sort((x, y) => Math.abs((x.skor ?? 0) - (s.skor ?? 0)) - Math.abs((y.skor ?? 0) - (s.skor ?? 0))).slice(0, 4)
    .map(x => `<a class="mini" href="sepatu.html?id=${encodeURIComponent(x.id)}">${SP.ring(x.skor, 48)}<div><b>${e(x.brand)} ${e(x.model)}</b><span>${e(x.subtipe || x.kategori)}</span></div></a>`).join('');
  const yt = SP.ytId(s.video);
  const TOKO = [['website', 'Website resmi'], ['tokopedia', 'Tokopedia'], ['shopee', 'Shopee'], ['blibli', 'Blibli']];
  const beli = TOKO.filter(([k]) => /^https:\/\//.test(s.beli?.[k] || '')).map(([k, n]) => {
    const cari = /\/product\?q=|\/search\?/.test(s.beli[k]) || (s.beli.cari || []).includes(k);
    return `<a class="beli-${k}" href="${e(s.beli[k])}" target="_blank" rel="noopener nofollow">${n}<small>${cari ? 'Cari di toko resmi' : 'Toko resmi'}</small></a>`;
  }).join('');

  // ----- detail tes per komponen (data/detail.json) -----
  let D = {};
  try { D = (await (await fetch('data/detail.json', { cache: 'no-cache' })).json())[s.id] || {}; } catch (er) {}
  const ada = v => v !== undefined && v !== null && v !== '';
  const kv = rows => { const r = rows.filter(x => ada(x[1]) && x[1] !== false); return r.length ? `<table class="fakta dt">${r.map(([k, v]) => `<tr><td>${e(k)}</td><td>${e(v)}</td></tr>`).join('')}</table>` : ''; };
  const kualitas = q => q ? `<span class="q q-${/excellent|very good|special/i.test(q) ? 'hi' : /good/i.test(q) ? 'ok' : /fair/i.test(q) ? 'md' : 'lo'}">${e(q)}</span>` : '';
  const level = l => l ? `<span class="q q-${/high/i.test(l) ? 'hi' : /medium/i.test(l) ? 'md' : 'lo'}">${/high/i.test(l) ? '▲' : /medium/i.test(l) ? '■' : '▼'} ${e(l)}</span>` : '–';
  const legenda = (a1, a2, avg) => `<div class="g-leg"><span><i class="c1"></i>${a1}</span>${a2 ? `<span><i class="c2"></i>${a2}</span>` : ''}${avg ? `<span><i class="c-avg"></i>${avg}</span>` : ''}</div>`;
  // grafik batang tebal sebelum vs setelah (mm)
  const grafikTebal = (items, nama) => {
    const it = items.filter(x => ada(x.sebelum));
    if (!it.length) return '';
    const mx = Math.max(...it.map(x => x.sebelum), ...it.map(x => x.setelah || 0)) || 1;
    return `<div class="grafik">${legenda('Sebelum dremel', 'Setelah dremel')}<div class="g-bar">${it.map(x => `
      <div class="g-grp"><div class="g-kol">
        <div class="g-b c1" style="height:${x.sebelum / mx * 100}%" title="Sebelum: ${f(x.sebelum)} mm"><b>${f(x.sebelum)}</b></div>
        <div class="g-b c2" style="height:${Math.max(ada(x.setelah) ? x.setelah / mx * 100 : 0, 1)}%" title="Setelah: ${ada(x.setelah) ? f(x.setelah) + ' mm' : '–'}"><b>${ada(x.setelah) ? f(x.setelah) : '–'}</b></div>
      </div><span>${e(nama(x))}</span></div>`).join('')}</div><div class="g-sat">Tebal (mm)</div></div>`;
  };
  const tabelDremel = (items, cols) => items.length ? `<div class="tbl-wrap"><table class="tbl-tes"><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${items.map(x => `<tr>${cols.map(c => `<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '';
  const mm = v => ada(v) ? f(v) + ' mm' : '–';

  // UPPER
  const U = D.upper || {};
  const daftarQA = (judul, arr) => arr?.length ? `<div class="qa"><h4>${judul}</h4><dl>${arr.map(x => `<div><dt>${e(x.label.replace(/\s*\(.*?\)\s*/g, ' ').trim())}</dt><dd>${e(x.hasil)}</dd></div>`).join('')}</dl></div>` : '';
  const htmlUpper = (U.bagian?.length || U.dremel?.length || U.lining || U.uji?.length) ? `
    ${U.bagian?.length ? `<h3 class="sub">Material per bagian</h3><div class="tbl-wrap"><table class="tbl-tes"><thead><tr><th>Bagian upper</th><th>Material</th></tr></thead><tbody>
      ${U.bagian.map(b => `<tr><td>${e(b.bagian)}</td><td>${e(b.material)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${kv([['Panel penguat (overlay)', U.panel && U.panel + (U.panelMaterial ? ' · ' + U.panelMaterial : '')], ['Lining', !U.bagian?.some(b => /lining/i.test(b.bagian)) && U.lining?.material], ['Hasil dremel lining', U.lining?.hasil], ['Proteksi air', U.air?.proteksi], ['Membran', U.air?.membran], ['Burn test', U.burn]])}
    ${U.uji?.length ? `<h3 class="sub">Tes upper tanpa dremel</h3><div class="qa-grid">${daftarQA('Finishing & ketahanan', U.uji)}</div>` : ''}
    ${U.dremel?.length ? `<h3 class="sub">${U.dremel.some(x => ada(x.sebelum)) ? 'Tebal upper sebelum & setelah dremel' : 'Hasil dremel upper'}</h3><p class="ket-h">Dremel grit 120, 15.500 rpm, maksimal 10 detik per material.</p>
      ${grafikTebal(U.dremel, x => [x.bagian, x.material].filter(Boolean).join(' · '))}
      ${tabelDremel(U.dremel, [['Bagian', x => e(x.bagian || '–')], ['Material', x => e(x.material || '–')], ['Sebelum', x => mm(x.sebelum)], ['Setelah', x => mm(x.setelah)], ['Terkikis', x => mm(x.terkikis)], ['Hasil', x => e(x.hasil || '–')], ['Kualitas', x => kualitas(x.kualitas) + (ada(x.skor) ? ` <small>${f(x.skor)}</small>` : '') || '–']])}` : ''}` : '';

  // MIDSOLE: dropball + durometer
  const M = D.midsole || {};
  const grafikDrop = (d, nama) => {
    if (!d?.p1?.length) return '';
    const mx = Math.max(...d.p1, ...(d.p2 || []), 1);
    return `<div class="drop"><h4>Dropball ${nama}</h4><div class="grafik">${legenda('Pantulan pertama', 'Pantulan kedua', ada(d.p1Avg) && `Rata-rata pantulan 1 (${f(d.p1Avg)} cm)`)}
      <div class="g-bar" style="--avg:${(d.p1Avg ?? 0) / mx * 100}%">${d.p1.map((v, i) => `
        <div class="g-grp"><div class="g-kol">
          <div class="g-b c1" style="height:${(v ?? 0) / mx * 100}%" title="Tes ${i + 1} · pantulan 1: ${ada(v) ? f(v) + ' cm' : '–'}"><b>${ada(v) ? f(v) : '–'}</b></div>
          <div class="g-b c2" style="height:${Math.max((d.p2?.[i] ?? 0) / mx * 100, 1)}%" title="Tes ${i + 1} · pantulan 2: ${ada(d.p2?.[i]) ? f(d.p2[i]) + ' cm' : '–'}"><b>${ada(d.p2?.[i]) ? f(d.p2[i]) : '–'}</b></div>
        </div><span>Tes ${i + 1}</span></div>`).join('')}
        ${ada(d.p1Avg) ? `<div class="g-avg" title="Rata-rata pantulan pertama: ${f(d.p1Avg)} cm"></div>` : ''}</div><div class="g-sat">Tinggi pantulan (cm) · bola dijatuhkan dari ${f(d.tinggi || 100)} cm</div></div>
      <div class="tbl-wrap"><table class="tbl-tes tbl-drop"><thead><tr><th>Tes ke-</th>${d.p1.map((_, i) => `<th>${i + 1}</th>`).join('')}<th>Rerata</th></tr></thead><tbody>
        <tr><td>Pantulan 1 (cm)</td>${d.p1.map(v => `<td>${ada(v) ? f(v) : '–'}</td>`).join('')}<td><b>${ada(d.p1Avg) ? f(d.p1Avg) : '–'}</b></td></tr>
        ${d.p2?.some(ada) ? `<tr><td>Pantulan 2 (cm)</td>${d.p1.map((_, i) => `<td>${ada(d.p2[i]) ? f(d.p2[i]) : '–'}</td>`).join('')}<td><b>${ada(d.p2Avg) ? f(d.p2Avg) : '–'}</b></td></tr>` : ''}
        <tr><td>Rebound %</td>${d.p1.map(v => `<td>${ada(v) ? f(Math.round(v / (d.tinggi || 100) * 1000) / 10) : '–'}</td>`).join('')}<td><b>${ada(d.rebound) ? f(d.rebound) : '–'}</b></td></tr>
      </tbody></table></div>
      <p class="ket-h">Rata-rata = jumlah 5 tes ÷ 5 · Rebound = pantulan 1 ÷ tinggi jatuh × 100% · Retensi = pantulan 2 ÷ pantulan 1 × 100%.</p>
      <div class="angka-grid">${[['Rata-rata pantulan 1', d.p1Avg, 'cm'], ['Rata-rata pantulan 2', d.p2Avg, 'cm'], ['Rebound', d.rebound, '%'], ['Retensi pantulan', d.retensi, '%']]
        .filter(x => ada(x[1])).map(([k, v, u]) => `<div><span>${k}</span><b>${f(v)}<i>${u}</i></b></div>`).join('')}</div></div>`;
  };
  const durZona = [[0, 15, 'Very Soft'], [15, 18, 'Soft'], [18, 22, 'Balanced'], [22, 40, 'Firm']];
  const grafikShore = (rows, maks = 40, zona = true) => {
    const r = rows.filter(x => ada(x[1]));
    if (!r.length) return '';
    return `<div class="shore">${zona ? `<div class="sh-zona">${durZona.map(([a, b, n]) => `<span style="left:${a / maks * 100}%;width:${(b - a) / maks * 100}%">${n}</span>`).join('')}</div>` : ''}
      ${r.map(([k, v]) => `<div class="sh-row"><span>${e(k)}</span><div class="sh-track"><div class="sh-fill" style="width:${Math.min(v / maks * 100, 100)}%" title="${e(k)}: ${f(v)} HA"></div></div><b>${f(v)} <i>HA</i></b></div>`).join('')}
      <div class="g-sat">Kekerasan Shore A (HA) · makin kecil makin empuk</div></div>`;
  };
  const dh = D.dropHeel, dtoe = D.dropToe;
  const htmlMidsole = (M.material?.length || dh || dtoe || ada(M.heel) || ada(M.forefoot) || D.footbed?.length || a.materialMidsole) ? `
    ${kv([['Material midsole', (M.material || [a.materialMidsole]).filter(Boolean).join(' + ')], ['Tipe midsole', M.tipe], ['Kelembutan heel / forefoot', (M.kelasHeel || M.kelasForefoot) && `${M.kelasHeel || '–'} / ${M.kelasForefoot || '–'}`], ['Selisih heel vs forefoot', ada(M.selisih) && f(M.selisih) + ' HA'], ['Transisi antar zona', M.transisi], ['Plate / shank', M.plate]])}
    ${D.midsoleRasa?.length || D.footbed?.length ? `<div class="qa-grid">${daftarQA('Rasa midsole saat dipakai', D.midsoleRasa)}${daftarQA('Footbed & bantalan', D.footbed)}</div>` : ''}
    ${dh || dtoe ? `<h3 class="sub">Tes dropball (5x)</h3><p class="ket-h">Bola yang sama dijatuhkan 5 kali di tiap titik, direkam slow-motion. Makin tinggi pantulan, makin besar energi yang dikembalikan midsole.</p>
      <div class="drop-grid">${grafikDrop(dh, 'heel')}${grafikDrop(dtoe, (D.dropToeLabel || 'toe').toLowerCase())}</div>` : ''}
    ${ada(M.heel) || ada(M.forefoot) ? `<h3 class="sub">Durometer midsole</h3><p class="ket-h">Durometer Shore A, rata-rata 3 titik per area. Di bawah 15 HA = sangat empuk, 15–18 empuk, 18–22 seimbang, di atas 22 keras.</p>
      ${grafikShore([['Heel' + (M.material?.[1] ? ' · ' + M.material[0] : ''), M.heel], ['Forefoot' + (M.material?.[1] ? ' · ' + M.material[0] : ''), M.forefoot],
        ['Heel · ' + (M.material?.[1] || 'material 2'), M.heel2], ['Forefoot · ' + (M.material?.[1] || 'material 2'), M.forefoot2], ...(M.lain || []).map((v, i) => ['Material lain ' + (i + 1), v])])}` : ''}` : '';

  // OUTSOLE
  const O = D.outsole || {};
  const htmlOutsole = (O.dremel?.length || O.shore?.length || a.outsoleMaterial) ? `
    ${kv([['Material outsole', (O.dremel || []).map(x => x.material).filter(Boolean).join(' + ') || a.outsoleMaterial], ['Standar penilaian', O.standar], ['Kategori', O.kategori], ['Kekerasan rata-rata', ada(O.shoreAvg) && f(O.shoreAvg) + ' HA']])}
    ${O.info?.length ? `<div class="qa-grid">${daftarQA('Cek outsole', O.info)}</div>` : ''}
    ${O.dremel?.some(x => !ada(x.sebelum) && (x.hasil || x.kualitas)) && !O.dremel?.some(x => ada(x.sebelum)) ? `<h3 class="sub">Hasil dremel outsole</h3>${tabelDremel(O.dremel, [['Material', x => e(x.material || '–')], ['Hasil', x => e(x.hasil || '–')], ['Kualitas', x => kualitas(x.kualitas) || '–']])}` : ''}
    ${O.dremel?.some(x => ada(x.sebelum)) ? `<h3 class="sub">Tebal outsole sebelum & setelah dremel</h3><p class="ket-h">Dremel grit 80, 15.500 rpm, maksimal 20 detik dengan tekanan tetap.</p>
      ${grafikTebal(O.dremel, x => [x.area, x.material].filter(Boolean).join(' · '))}
      ${tabelDremel(O.dremel, [['Area', x => e(x.area || '–')], ['Material', x => e(x.material || '–')], ['Sebelum', x => mm(x.sebelum)], ['Setelah', x => mm(x.setelah)], ['Aus', x => mm(x.aus)], ['Sisa', x => ada(x.sisa) ? f(x.sisa) + '%' : '–'], ['Hasil', x => e(x.hasil || '–')], ['Kualitas', x => kualitas(x.kualitas) + (ada(x.skor) ? ` <small>${f(x.skor)}</small>` : '') || '–']])}` : ''}
    ${O.shore?.length ? `<h3 class="sub">Durometer outsole</h3>${grafikShore(O.shore.map((v, i) => [(O.dremel?.[i]?.material || 'Material ' + (i + 1)), v]), 100, false)}` : ''}` : '';

  // TRAKSI: sebelum vs setelah dremel
  const T = D.traction || [];
  const baseT = T.filter(x => !/setelah dremel/i.test(x.kondisi));
  const htmlTraksi = T.length ? `<div class="tbl-wrap"><table class="tbl-tes"><thead><tr><th>Permukaan</th><th>Sebelum dremel</th><th>Setelah dremel</th></tr></thead><tbody>
    ${baseT.map(x => { const sd = T.find(y => /setelah dremel/i.test(y.kondisi) && y.kondisi.toLowerCase().replace(/\(.*|setelah dremel/g, '').trim() === x.kondisi.toLowerCase().replace(/\(.*|sebelum dremel/g, '').trim());
      return `<tr><td>${e(x.kondisi.replace(/\s*\(sebelum dremel\)/i, '').replace(/^\w/, c => c.toUpperCase()))}</td><td>${level(x.level || x.hasil)}<small class="hasil">${e(x.hasil && x.hasil !== x.level ? x.hasil : '')}</small></td><td>${sd ? level(sd.level || sd.hasil) : '–'}</td></tr>`; }).join('')}
    </tbody></table></div>${D.tractionRetensi ? `<p class="ket-h">Traction retention: <b>${e(D.tractionRetensi)}</b></p>` : ''}` : '';

  // PEMAKAIAN & KONSTRUKSI
  const htmlPakai = (D.wear?.length || D.tangan?.length || D.bonding?.length || D.hak?.length) ? `${D.catatan?.insight && !/^migrasi|^\[tipe/i.test(D.catatan.insight) ? `<blockquote class="insight">${e(D.catatan.insight.replace(/^(\s*\[[^\]]*\])+\s*/, ''))}</blockquote>` : ''}<div class="qa-grid">${daftarQA('Tes pemakaian', D.wear)}${daftarQA('Tes tangan & konstruksi', D.tangan)}${daftarQA('Hak & heel tip', D.hak)}${daftarQA('Tes bonding', D.bonding)}${daftarQA('Ukuran & geometri', D.ukur)}</div>` : '';

  const bagian = [
    ['ringkasan', 'Ringkasan', plus.length || minus.length],
    ['skor', 'Skor per layer', layer],
    ['lab', 'Hasil tes lab', barisUji],
    ['upper', 'Upper', htmlUpper],
    ['midsole', 'Midsole', htmlMidsole],
    ['outsole', 'Outsole', htmlOutsole],
    ['traksi', 'Tes traksi', htmlTraksi],
    ['pemakaian', 'Tes pemakaian', htmlPakai],
    ['klaim', 'Klaim brand', s.klaim || s.masalah],
    ['video', 'Video bedah', yt],
    ['mirip', 'Sepatu sejenis', mirip]
  ].filter(x => x[2]);

  el.innerHTML = `
  <div class="remah"><a href="database.html">Database</a> › <a href="database.html?kategori=${encodeURIComponent(s.kategori)}">${e(s.kategori)}</a> › ${e(s.brand)} ${e(s.model)}</div>
  <section class="d-hero">
    <div class="d-foto">${SP.foto(s)}</div>
    <div class="d-info">
      ${s.lengkap === false ? '<div class="info-kurang">Sebagian tes untuk sepatu ini belum tercatat, jadi skor akhirnya dihitung dari data yang ada. Angka bisa berubah setelah tes dilengkapi.</div>' : ''}
      <div class="brand">${e(s.brand)}</div>
      <h1>${e(s.model)}</h1>
      <div class="d-skor">${SP.ring(s.skor, 96, 'Skor')}
        <div class="ket"><b style="color:${t.w}">${e(s.verdict || t.t)}</b>
        <span>Skor akhir dari ${s.layer?.length || 4} layer: material, konstruksi, fungsi & kenyamanan.</span></div></div>
      <table class="fakta">${fakta}</table>
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        <button class="tombol gelap" id="tbanding">+ Bandingkan</button>
        ${yt ? `<a class="tombol garis" href="#video">▶ Tonton bedahnya</a>` : ''}
      </div>
      ${beli ? `<div class="beli"><h4>Beli di toko resmi</h4><div class="beli-list">${beli}</div><p>Harga & stok mengikuti toko masing-masing.</p></div>` : ''}
    </div>
  </section>

  <div class="d-badan">
    <nav class="toc"><h4>Di halaman ini</h4>${bagian.map(([i, j]) => `<a href="#${i}">${j}</a>`).join('')}</nav>
    <div>
      ${plus.length || minus.length ? `<section class="panel" id="ringkasan"><h2>Ringkasan</h2><p class="ket-h">Dihitung otomatis dari hasil lab, dibandingkan dengan ${grup.length} ${namaGrup} yang sudah kami bedah.</p>
        <div class="pk"><div class="plus"><h3>Kelebihan</h3><ul>${plus.map(x => `<li>${e(x)}</li>`).join('') || '<li>–</li>'}</ul></div>
        <div class="minus"><h3>Kekurangan</h3><ul>${minus.map(x => `<li>${e(x)}</li>`).join('') || '<li>–</li>'}</ul></div></div></section>` : ''}

      ${layer ? `<section class="panel" id="skor"><h2>Skor per layer</h2><p class="ket-h">Bobot tiap layer menyesuaikan tipe sepatu.</p><div class="lyr">${layer}</div></section>` : ''}

      ${barisUji ? `<section class="panel" id="lab"><h2>Hasil tes lab</h2><p class="ket-h">Garis kuning = posisi sepatu ini di antara ${namaGrup} yang sudah kami bedah · garis hitam = rata-rata.</p>${barisUji}</section>` : ''}

      ${htmlUpper ? `<section class="panel" id="upper"><h2>Upper</h2><p class="ket-h">Material penyusun upper dan ketahanannya terhadap gesekan.</p>${htmlUpper}</section>` : ''}

      ${htmlMidsole ? `<section class="panel" id="midsole"><h2>Midsole</h2><p class="ket-h">Bahan bantalan, pantulan energi, dan kekerasannya.</p>${htmlMidsole}</section>` : ''}

      ${htmlOutsole ? `<section class="panel" id="outsole"><h2>Outsole</h2><p class="ket-h">Bahan sol bawah dan seberapa cepat ia aus.</p>${htmlOutsole}</section>` : ''}

      ${htmlTraksi ? `<section class="panel" id="traksi"><h2>Tes traksi</h2><p class="ket-h">Sepatu diinjak dan digeser di keramik yang sama, kering lalu basah, sebelum dan setelah outsole di-dremel.</p>${htmlTraksi}</section>` : ''}

      ${htmlPakai ? `<section class="panel" id="pemakaian"><h2>Tes pemakaian</h2><p class="ket-h">Hasil wear test oleh tester, cek tangan, dan tarik bonding.</p>${htmlPakai}</section>` : ''}

      ${s.klaim || s.masalah ? `<section class="panel" id="klaim"><h2>Klaim brand vs hasil</h2><p class="ket-h">Apa kata brand, dan apa yang kami temukan.</p><div class="klaim">
        ${s.klaim ? `<p><b>Klaim brand:</b> ${e(s.klaim)}</p>` : ''}
        ${s.masalah ? `<p><b>Temuan kami:</b> ${e(s.masalah)}</p>` : ''}
        ${s.klaimHasil ? `<span class="stempel">${e(s.klaimHasil)}</span>` : ''}</div></section>` : ''}

      ${yt ? `<section class="panel" id="video"><h2>Video bedah</h2><p class="ket-h">Proses pengujian lengkap di YouTube Shoe Police.</p><iframe class="video" src="https://www.youtube-nocookie.com/embed/${yt}" allowfullscreen loading="lazy"></iframe></section>` : ''}

      ${mirip ? `<section class="panel" id="mirip"><h2>Sepatu sejenis</h2><p class="ket-h">Skor paling dekat di kategori yang sama.</p><div class="mirip">${mirip}</div></section>` : ''}
    </div>
  </div>`;

  // tombol bandingkan
  const tb = document.getElementById('tbanding');
  const sync = () => { const ada = SP.ambilBanding().includes(s.id); tb.textContent = ada ? '✓ Masuk daftar banding' : '+ Bandingkan'; };
  tb.onclick = () => {
    let b = SP.ambilBanding();
    if (b.includes(s.id)) b = b.filter(x => x !== s.id); else b.push(s.id);
    SP.simpanBanding(b); sync();
    if (SP.ambilBanding().length >= 2 && confirm('Buka halaman bandingkan sekarang?')) location.href = 'bandingkan.html';
  };
  sync();

  // highlight daftar isi saat scroll
  const links = [...document.querySelectorAll('.toc a')];
  const obs = new IntersectionObserver(en => en.forEach(x => { if (x.isIntersecting) links.forEach(l => l.classList.toggle('aktif', l.hash === '#' + x.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.panel').forEach(p => obs.observe(p));
})();
</script>
</body>
</html>
